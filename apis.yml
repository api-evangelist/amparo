name: Amparo
description: 'Amparo is a Brazilian fintech that supports bereaved families in the days after a funeral.
  Its Central de Cadastros uses automated document reading and data extraction to register a family once
  and share that data across partner systems, while a WhatsApp assistant delivers personalized financial
  guidance covering INSS pension advances, life-insurance payouts, credit, repatriation reimbursements,
  and debt and inventory organization. Amparo exposes integration APIs so its Central de Cadastros can
  connect with funeral-home and insurer client systems. Backed by QED Investors.'
